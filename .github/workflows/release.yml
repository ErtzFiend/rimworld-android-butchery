name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build release package
        run: |
          set -euo pipefail
          OUT="/tmp/AndroidButchery-${GITHUB_REF_NAME}.zip"
          STAGE="$(mktemp -d)/AndroidButchery"
          mkdir -p "$STAGE"
          cp -r About 1.7 README.md "$STAGE/"
          (cd "$(dirname "$STAGE")" && zip -r "$OUT" AndroidButchery)
          ls -l "$OUT"
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: /tmp/AndroidButchery-${{ github.ref_name }}.zip
          generate_release_notes: true
